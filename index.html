/* pages */
.page{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h-display{font-family:var(--f-display);font-weight:700;letter-spacing:.03em;font-size:clamp(28px,4vw,40px);line-height:1.05;text-transform:uppercase}
.lede{color:var(--muted);max-width:70ch;margin:8px 0 0}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.sec-h .note{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart .lbl{fill:var(--ink);font-family:var(--f-body);font-size:12px;font-weight:600}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.scroll-x{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--c)}
.back{appearance:none;border:0;background:none;padding:4px 0;color:var(--accent-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;text-decoration:none}

/* heat table */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--f-mono);font-size:10.5px;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
td.heat{text-align:center;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;border-left:2px solid var(--surface);min-width:50px}
td.heat.proj{font-style:italic;background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--surface) 45%,transparent) 5px 7px)}
tr.clk{cursor:pointer}
tr.clk:hover td{background-color:var(--surface-2)}
.trend{font-family:var(--f-mono);font-size:12px;white-space:nowrap}

/* navies list */
.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ncard{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--nc)}
.ncard:hover{border-color:var(--nc)}
.ncard h3{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.03em}
.ncard .s{color:var(--muted);font-size:13px}
.ncard .row{display:flex;gap:14px;font-family:var(--f-mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.ncard .row b{color:var(--ink);font-weight:500}

/* dossier */
.dhead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;border-bottom:3px solid var(--nc);padding-bottom:14px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}
.fig{background:var(--surface);padding:12px 14px;min-width:0;margin:0}
.fig dt{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.fig dd{margin:3px 0 0;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.fig dd small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.cat-h{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:18px 2px 8px;display:flex;align-items:center;gap:10px}
.cat-h::after{content:"";flex:1;height:1px;background:var(--line)}
.asset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.asset>summary{list-style:none;cursor:pointer;padding:11px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.asset>summary::-webkit-details-marker{display:none}
.asset>summary:hover{background:var(--surface-2)}
.asset .an{font-weight:700;font-size:15.5px;line-height:1.3}
.asset .at{color:var(--muted);font-size:13px}
.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:130px}
.pip{width:8px;height:8px;border-radius:2px;background:var(--ok)}
.pip.B{background:var(--build)}.pip.L{background:var(--lost)}.pip.R,.pip.U{background:var(--unk)}
.asset-b{padding:4px 14px 14px;border-top:1px solid var(--line-2);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.asset-b{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:minmax(96px,max-content) minmax(0,1fr);gap:4px 14px;margin:8px 0 0;font-size:13.5px}
.kv dt{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.kv dd{margin:0}
.hulls{width:100%;font-size:13.5px;margin-top:8px}
.st{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:3px;white-space:nowrap;border:1px solid}
.st.A{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.st.B{color:var(--build);border-color:color-mix(in srgb,var(--build) 40%,transparent)}
.st.L{color:var(--lost);border-color:color-mix(in srgb,var(--lost) 40%,transparent)}
.st.R,.st.U{color:var(--unk);border-color:color-mix(in srgb,var(--unk) 40%,transparent)}
.tl{border-left:2px solid var(--accent);padding:1px 0 1px 12px;margin-top:8px;font-size:13.5px}
.tl .when{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tl p{margin:1px 0}
details.jx summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:8px}
details.jx .kv{font-size:12.5px}

/* watch */
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.vcard>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center}
.vcard>summary::-webkit-details-marker{display:none}
.vcard>summary:hover{background:var(--surface-2)}
.vcard .vn{font-weight:700;font-size:16px}
.vcard .vs{color:var(--muted);font-size:13px}
.age{font-family:var(--f-mono);font-size:11.5px;text-align:right;white-space:nowrap}
.age b{display:block;font-size:13px;color:var(--ink);font-weight:500}
.age.fresh b{color:var(--signal)}
.vbody{padding:2px 14px 14px;border-top:1px solid var(--line-2)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--vessel);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:13.5px}
.notice strong{color:var(--ink)}
.hs{display:grid;grid-template-columns:minmax(0,1.3fr) 70px minmax(0,2fr);gap:12px;padding:10px 14px;border-bottom:1px solid var(--line-2);align-items:baseline;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;appearance:none}
.hs:hover{background:var(--surface-2)}
.hs:last-child{border-bottom:0}
.hs .n{font-weight:700}
.hs .c{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hs .l{font-size:13px;color:var(--muted);min-width:0}
@media (max-width:600px){.hs{grid-template-columns:minmax(0,1fr) 60px}.hs .l{grid-column:1/-1}}
.about{font-size:13.5px;color:var(--muted)}
.about li{margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.side{transition:none}#toast{transition:none}}
</style>

/* rough sea-area classifier for incidents and firings */
function areaOf(lon, lat){
  if(lon == null || lat == null) return 'Unlocated';
  if(lon >= 104 && lon <= 122 && lat >= -1 && lat <= 23.5) return 'South China Sea';
  if(lon >= 116 && lon <= 132 && lat > 21 && lat <= 36) return 'Taiwan & East China Sea';
  if(lon >= 47 && lon <= 60.5 && lat >= 23 && lat <= 31) return 'Gulf & Hormuz';
  if(lon >= 32 && lon < 51 && lat >= 10 && lat <= 30) return 'Red Sea & Aden';
  if(lon >= 56 && lon <= 78 && lat >= 5 && lat < 26) return 'Arabian Sea & Gulf of Oman';
  if(lon >= 78 && lon <= 100 && lat >= 5 && lat <= 24) return 'Bay of Bengal & Andaman';
  if(lon >= 30 && lon <= 120 && lat >= -50 && lat < 30) return 'Indian Ocean';
  return 'Elsewhere';
}

    if(!cfg.dataUrl) return;

function decodeTopo(t){

/* India as recognised by the Government of India (Survey of India outline incl. all of Jammu & Kashmir and Ladakh).
   Source: Highcharts Map Collection, "India with disputed territories" (in-all-disputed), via jsDelivr. */
async function loadIndia(){
  try {
    let t = null;
    if(window.IORNW_APK){ try { t = await (await fetch('lib/india.json')).json(); } catch(e){ t = null; } }
    if(!t){ const m = await import('https://cdn.jsdelivr.net/npm/@highcharts/map-collection@2.3.0/countries/in/custom/in-all-disputed.topo.json/+esm'); t = m.default || m; }

    const d = decodeTopo(t);

    d.feats.forEach(f => { const g = f.geometry; if(g.type === 'Polygon') polys.push(g.coordinates); else g.coordinates.forEach(p => polys.push(p)); });

}

  const acol = {'South China Sea':'#B3262E','Gulf & Hormuz':'#D2601A','Arabian Sea & Gulf of Oman':'#E39A3B','Indian Ocean':'#1F6F93','Bay of Bengal & Andaman':'#4E8BA6','Red Sea & Aden':'#8C5A2B','Taiwan & East China Sea':'#6A5A9C','Elsewhere':'#9AA6AD','Unlocated':'#C9D2D7'};
  const qs = []; for(let y = 2024; y <= 2026; y++) for(let q = 1; q <= 4; q++){ if(Date.UTC(y, (q - 1) * 3, 1) <= NOW) qs.push(y + ' Q' + q); }

    qs.forEach((q, i) => { let y = Hc - B; const x = L + i * bw + 3; usedA.forEach(a => { const n = (qa[q] || {})[a] || 0; if(!n) return; const h = sy(n); y -= h; s += `<rect x="${x}" y="${y}" width="${bw - 6}" height="${h - 1}" fill="${acol[a]}"><title>${q} · ${a}: ${n}</title></rect>`; }); if(q.endsWith('Q1')) s += `<text x="${x}" y="${Hc - 6}">${q.slice(0, 4)}</text>`; });

    ${f ? `<div class="acts" style="margin:8px 0"><button class="btn ghost" data-go="${f.lon},${f.lat}" data-key="v:${esc(v.id)}">Show last fix on globe</button></div>` : ''}
    ${(v.last && !s.some(x => x.date === v.last.date)) ? `<div class="tl"><span class="when">${fdate(v.last.date)} · latest report</span><p>${esc(v.last.place || '')}</p>${v.last.url ? `<a href="${esc(v.last.url)}" target="_blank" rel="noopener" style="font-size:12.5px">${esc(v.last.source || 'Source')}</a>` : ''}</div>` : ''}
    ${s.map(x => `<div class="tl"><span class="when">${fdate(x.date)} · ${esc(x.place || '')}</span><p>${esc(x.text || '')}</p>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener" style="font-size:12.5px">${esc(x.source || 'Source')}</a>` : ''}</div>`).join('')}</div></details>`; }).join('') || '<p class="note">No vessels logged yet.</p>'}</div>
  <div class="grid2 sec">
    <div class="panel"><div class="sec-h"><h2 style="font-size:18px">Hotspots</h2></div><div style="margin:0 -16px">${D.hotspots.map(h => { const n = scs.filter(e => e.hotspot === h.id).length; return `<button class="hs" data-go="${h.lon},${h.lat}"><span class="n">${esc(h.name)}</span><span class="c">${n} logged</span><span class="l">${(h.claimants || []).map(tagH).join(' ')}</span></button>`; }).join('')}</div></div>
    <div class="panel"><div class="sec-h"><h2 style="font-size:18px">Militia &amp; coast guard incidents</h2><span class="note">${scs.length} logged</span></div><div class="mini-list" style="border-top:0">${scs.map(e => `<button data-go="${e.lon},${e.lat}" data-key="e:${esc(e.id)}"><span class="d">${fdate(e.date)}</span><span><span class="kind" style="--kc:${kcol[e.kind] || '#566570'}">${esc(e.kind || 'incident')}</span> ${esc(e.title)}${e.against ? ' ' + tagH(e.against) : ''}</span></button>`).join('')}</div></div>
  </div>`;
}

/* ---------- EW & Intel ---------- */
let intelTopic = 'All';
function viewIntel(){
  const bs = D.briefs.slice().sort((a, b) => ts(b.date) - ts(a.date));
  const topics = {}; bs.forEach(b => (b.topics || []).forEach(t => topics[t] = (topics[t] || 0) + 1));
  const tl = ['All'].concat(Object.keys(topics).sort((a, b) => topics[b] - topics[a]));
  if(!tl.includes(intelTopic)) intelTopic = 'All';
  const list = bs.filter(b => intelTopic === 'All' || (b.topics || []).includes(intelTopic));
  page.innerHTML = `<div class="eyebrow">EW &amp; Intel</div><h1 class="h-display">Spectrum &amp; sensors</h1><p class="lede">Electronic warfare, sensors, decoys, counter-drone and naval technology reporting, led by Armada International. Items that touch a watched navy carry its tag.</p>
  <div class="bar" style="display:flex;flex-wrap:wrap;gap:6px;margin:16px 0">${tl.map(t => `<button type="button" class="chip" data-topic="${esc(t)}" aria-pressed="${intelTopic === t}">${esc(t)}${t !== 'All' ? ` <span class="ct">${topics[t]}</span>` : ''}</button>`).join('')}</div>
  <div class="briefs">${list.map(b => `<article class="brief"><div class="bb"><div class="fi-m" style="margin:0"><span class="d">${fdate(b.date)}</span>${(b.navies || []).map(tagH).join('')}${(b.topics || []).map(t => `<span class="kind" style="--kc:var(--accent)">${esc(t)}</span>`).join('')}</div><h3>${esc(b.title)}</h3><p>${esc(b.summary || '')}</p><div class="src" style="margin-top:auto"><span class="lbl">Source</span><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.source || 'Article')}</a>${b.author ? `<span class="lbl">${esc(b.author)}</span>` : ''}</div></div></article>`).join('') || `<p class="lede">${D.loaded.briefs ? 'No briefs in this topic yet.' : 'Loading briefs…'}</p>`}</div>`;
}
page.addEventListener('click', e => { const b = e.target.closest('[data-topic]'); if(b){ intelTopic = b.dataset.topic; viewIntel(); } });

/* ---------- router ---------- */
let current = '';
function route(){
  const h = (location.hash || '#globe').slice(1) || 'globe';
  const v = h.startsWith('c-') ? 'dossier' : ['globe', 'navies', 'analysis', 'watch', 'intel'].includes(h) ? h : 'globe';
  UI.view = v; current = h;
  document.querySelectorAll('#tabs .tab').forEach(t => t.setAttribute('aria-current', (t.dataset.v === v || (v === 'dossier' && t.dataset.v === 'navies')) ? 'page' : 'false'));
  $('#v-globe').hidden = v !== 'globe'; page.hidden = v === 'globe';
  X.globeStart();
  if(v === 'globe'){ X.globeResize(); X.renderGlobeUi(); return; }
  X.closePop(); render(); window.scrollTo(0, 0);
}
function render(){
  const open = [...page.querySelectorAll('details[open]')].map(d => d.id).filter(Boolean); const sy = window.scrollY;
  if(UI.view === 'navies') viewNavies(); else if(UI.view === 'dossier') viewDossier(current.slice(2)); else if(UI.view === 'analysis') viewAnalysis(); else if(UI.view === 'watch') viewWatch(); else if(UI.view === 'intel') viewIntel();
  open.forEach(id => { const d = document.getElementById(id); if(d) d.open = true; }); window.scrollTo(0, sy);
}
X.setRefresh(() => { if(UI.view === 'globe') X.renderGlobeUi(); else render(); });
X.rerenderPage = () => { if(UI.view !== 'globe') render(); };
X.onEEZ = () => { if(UI.view === 'dossier' || UI.view === 'navies') render(); };
addEventListener('hashchange', route);
route();
})();

</script>
</body></html>
